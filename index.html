<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ours Cafe - Staff POS & Kitchen Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans Ethiopic', sans-serif; background-color: #070d18; color: #f1f5f9; }
        .kanban-box { background: #111c33; border-radius: 24px; border: 1px solid #1e2f56; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="p-4 sm:p-6">

    <!-- Top Bar -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-5 mb-6 border-b border-slate-800">
        <div class="flex items-center gap-3.5">
            <div class="w-12 h-12 rounded-2xl bg-amber-500 text-slate-950 flex items-center justify-center text-2xl font-black shadow-lg">☕</div>
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <span>Ours Cafe</span>
                    <span class="text-xs bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded-md font-bold">Kitchen & POS Operations</span>
                </h1>
                <p class="text-xs text-emerald-400 font-bold flex items-center gap-1.5 mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Google Sheets Polling Active (Every 6s)
                </p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <button onclick="openModal('stockModal')" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-bold border border-slate-700 flex items-center gap-1.5 text-amber-400">
                <i class="fa-solid fa-boxes-stacked"></i> Stock Control (የምግብ ክምችት)
            </button>
            <button onclick="playAlertSound('order')" class="px-3 py-2 bg-blue-600/30 text-blue-300 hover:bg-blue-600/50 rounded-xl text-xs font-bold border border-blue-500/40 flex items-center gap-1">
                <i class="fa-solid fa-volume-high"></i> Sound Test
            </button>
            <button onclick="fetchStaffData()" class="px-3.5 py-2 bg-emerald-600/30 text-emerald-300 hover:bg-emerald-600/50 rounded-xl text-xs font-bold border border-emerald-500/40 flex items-center gap-1">
                <i class="fa-solid fa-rotate"></i> አድስ (Sync)
            </button>
        </div>
    </header>

    <!-- Table Matrix -->
    <section class="mb-6">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">የጠረጴዛዎች ሁኔታ ካርታ (Table Matrix)</h3>
        <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-12 gap-2" id="tableMatrix"></div>
    </section>

    <!-- 4-Stage Kanban -->
    <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-8">
        <!-- New -->
        <div class="kanban-box p-4 min-h-[500px] flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                    <h3 class="font-bold text-xs text-sky-400 uppercase"><i class="fa-solid fa-inbox"></i> 1. አዲስ ትዕዛዝ</h3>
                    <span id="newBadge" class="bg-sky-500/20 text-sky-300 text-xs px-2.5 py-0.5 rounded-full font-black">0</span>
                </div>
                <div class="space-y-3 max-h-[460px] overflow-y-auto hide-scroll" id="colNew"></div>
            </div>
        </div>

        <!-- Kitchen -->
        <div class="kanban-box p-4 min-h-[500px] flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                    <h3 class="font-bold text-xs text-amber-400 uppercase"><i class="fa-solid fa-fire-burner"></i> 2. በዝግጅት ላይ</h3>
                    <span id="prepBadge" class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-0.5 rounded-full font-black">0</span>
                </div>
                <div class="space-y-3 max-h-[460px] overflow-y-auto hide-scroll" id="colKitchen"></div>
            </div>
        </div>

        <!-- Eating -->
        <div class="kanban-box p-4 min-h-[500px] flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                    <h3 class="font-bold text-xs text-indigo-400 uppercase"><i class="fa-solid fa-utensils"></i> 3. በመመገብ ላይ</h3>
                    <span id="eatingBadge" class="bg-indigo-500/20 text-indigo-300 text-xs px-2.5 py-0.5 rounded-full font-black">0</span>
                </div>
                <div class="space-y-3 max-h-[460px] overflow-y-auto hide-scroll" id="colEating"></div>
            </div>
        </div>

        <!-- Verify Payment -->
        <div class="kanban-box p-4 bg-[#142340] min-h-[500px] flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                    <h3 class="font-bold text-xs text-emerald-400 uppercase"><i class="fa-solid fa-receipt"></i> 4. ክፍያ ማረጋገጫ</h3>
                    <span id="verifyBadge" class="bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-0.5 rounded-full font-black">0</span>
                </div>
                <div class="space-y-3 max-h-[460px] overflow-y-auto hide-scroll" id="colVerify"></div>
            </div>
        </div>
    </section>

    <!-- Calls -->
    <section class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
        <h3 class="text-sm font-bold text-rose-400 mb-3 flex items-center gap-2"><i class="fa-solid fa-bell animate-bounce"></i> የአስተናጋጅ ጥሪዎች (Sheet 3 Calls)</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3" id="activeCallsContainer"></div>
    </section>

    <!-- STOCK MODAL -->
    <div id="stockModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 w-full max-w-md text-white shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                <h3 class="font-bold text-sm text-amber-400">የምግብ ክምችት መቆጣጠሪያ (Stock Control)</h3>
                <button onclick="closeModal('stockModal')" class="text-gray-400 text-xl font-bold">&times;</button>
            </div>
            <div class="space-y-2.5 text-xs max-h-[60vh] overflow-y-auto hide-scroll" id="stockListContainer"></div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3VCGu6yzPlC5NG1qEw2wsbz_4IRtXzzaBio77t8vHU2afFsek-1qtXhpEdvk08HtF/exec";

        let localOrders = [];
        let localCalls = [];
        let localMenu = [];

        async function fetchStaffData() {
            try {
                const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getStaffData`);
                const data = await res.json();
                if (data.orders) localOrders = data.orders;
                if (data.calls) localCalls = data.calls;
                if (data.menu) localMenu = data.menu;

                renderKanban();
                renderCalls();
                renderTableMatrix();
                renderStockList();
            } catch (e) {}
        }

        function renderKanban() {
            const colNew = document.getElementById('colNew');
            const colKitchen = document.getElementById('colKitchen');
            const colEating = document.getElementById('colEating');
            const colVerify = document.getElementById('colVerify');

            colNew.innerHTML = ''; colKitchen.innerHTML = ''; colEating.innerHTML = ''; colVerify.innerHTML = '';
            let cNew = 0, cPrep = 0, cEat = 0, cVer = 0;

            localOrders.forEach(ord => {
                if (ord.Order_Status === 'New') {
                    cNew++;
                    colNew.innerHTML += `
                        <div class="p-4 bg-slate-800 rounded-2xl border-l-4 border-sky-500 text-xs shadow space-y-2">
                            <div class="flex justify-between font-bold text-white"><span class="text-sm">ጠረጴዛ ${ord.Table_No}</span><span class="text-amber-400">#${ord.Order_ID}</span></div>
                            <p class="text-slate-200">${ord.Items_Ordered}</p>
                            ${ord.Customer_Note ? `<span class="block bg-slate-900 text-amber-300 p-1 rounded text-[11px]">ማስታወሻ፡ ${ord.Customer_Note}</span>` : ''}
                            <button onclick="updateOrderStatus('${ord.Order_ID}', 'Kitchen')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs">ወደ ኪችን ላክ</button>
                        </div>`;
                } else if (ord.Order_Status === 'Kitchen') {
                    cPrep++;
                    colKitchen.innerHTML += `
                        <div class="p-4 bg-slate-800 rounded-2xl border-l-4 border-amber-500 text-xs shadow space-y-2">
                            <div class="flex justify-between font-bold text-white"><span class="text-sm">ጠረጴዛ ${ord.Table_No}</span><span class="text-amber-400">#${ord.Order_ID}</span></div>
                            <p class="text-slate-200">${ord.Items_Ordered}</p>
                            <button onclick="updateOrderStatus('${ord.Order_ID}', 'Served')" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs">ደርሷል ➔ በመመገብ ላይ</button>
                        </div>`;
                } else if (ord.Order_Status === 'Served' && ord.Payment_Status !== 'Verification_Pending') {
                    cEat++;
                    colEating.innerHTML += `
                        <div class="p-4 bg-slate-800 rounded-2xl border-l-4 border-indigo-500 text-xs shadow space-y-2">
                            <div class="flex justify-between font-bold text-white"><span>ጠረጴዛ ${ord.Table_No}</span><span class="text-emerald-400 font-bold">${ord.Total_Price}</span></div>
                            <p class="text-slate-300 text-[11px]">${ord.Items_Ordered}</p>
                            <span class="block bg-indigo-950 text-indigo-300 p-1.5 rounded text-center text-[10px] font-bold">በመመገብ ላይ</span>
                        </div>`;
                } else if (ord.Payment_Status === 'Verification_Pending') {
                    cVer++;
                    colVerify.innerHTML += `
                        <div class="p-4 bg-slate-800 rounded-2xl border-2 border-emerald-500 text-xs shadow space-y-2 animate-pulse">
                            <div class="flex justify-between font-bold text-white"><span>ጠረጴዛ ${ord.Table_No}</span><span class="text-emerald-400 font-bold">${ord.Total_Price}</span></div>
                            <p class="text-slate-200">${ord.Payment_Method} ክፍያ ቀርቧል</p>
                            <button onclick="confirmPayment('${ord.Order_ID}')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs">ክፍያውን አረጋግጥና ዝጋ ✓</button>
                        </div>`;
                }
            });

            document.getElementById('newBadge').innerText = cNew;
            document.getElementById('prepBadge').innerText = cPrep;
            document.getElementById('eatingBadge').innerText = cEat;
            document.getElementById('verifyBadge').innerText = cVer;
        }

        function renderCalls() {
            const container = document.getElementById('activeCallsContainer');
            const activeCalls = localCalls.filter(c => c.Status === 'Active');
            if (activeCalls.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 col-span-full text-center py-2">ምንም ንቁ ጥሪ የለም ✓</p>`;
                return;
            }
            container.innerHTML = activeCalls.map(c => `
                <div class="p-3 bg-rose-950/60 border border-rose-600 text-xs rounded-2xl flex justify-between items-center">
                    <div><span class="font-black text-rose-300">ጠረጴዛ ${c.Table_No}</span><p class="text-slate-200">${c.Request_Type}</p></div>
                    <button onclick="dismissCall('${c.Call_ID}')" class="px-3 py-1.5 bg-rose-600 text-white rounded-xl font-bold">አጥፋ</button>
                </div>`).join('');
        }

        function renderTableMatrix() {
            const matrix = document.getElementById('tableMatrix');
            matrix.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                const tNo = i < 10 ? '0' + i : '' + i;
                const hasVerify = localOrders.some(o => (String(o.Table_No) == String(i) || String(o.Table_No) == tNo) && o.Payment_Status === 'Verification_Pending');
                const hasCall = localCalls.some(c => (String(c.Table_No) == String(i) || String(c.Table_No) == tNo) && c.Status === 'Active');
                const isEating = localOrders.some(o => (String(o.Table_No) == String(i) || String(o.Table_No) == tNo) && o.Order_Status === 'Served');

                let cls = 'bg-slate-900 border-slate-700 text-slate-400';
                if (hasCall) cls = 'bg-rose-950 border-rose-500 text-rose-300 animate-bounce font-bold';
                else if (hasVerify) cls = 'bg-emerald-950 border-emerald-500 text-emerald-300 animate-pulse font-bold';
                else if (isEating) cls = 'bg-indigo-950 border-indigo-500 text-indigo-300 font-bold';

                matrix.innerHTML += `<div class="p-2 text-center rounded-xl text-xs border ${cls}">T-${tNo}</div>`;
            }
        }

        function renderStockList() {
            const container = document.getElementById('stockListContainer');
            if (!localMenu || localMenu.length === 0) return;
            container.innerHTML = localMenu.map(item => {
                const isAvail = String(item.Status || "").toLowerCase() === 'available';
                return `
                    <div class="flex justify-between items-center p-3 bg-slate-800 rounded-xl border border-slate-700">
                        <div><p class="font-bold text-white">${item.Name_AM || item.Name_EN}</p><span class="text-slate-400 text-[10px]">${item.Price} ETB</span></div>
                        <button onclick="toggleStockStatus('${item.Item_ID}', '${item.Status}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold ${isAvail ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}">
                            ${isAvail ? 'Available ✓' : 'Out of Stock ✕'}
                        </button>
                    </div>`;
            }).join('');
        }

        function updateOrderStatus(orderId, status) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "updateOrderStatus", orderId: orderId, orderStatus: status })
            });
            const ord = localOrders.find(x => String(x.Order_ID).trim() === String(orderId).trim());
            if (ord) ord.Order_Status = status;
            renderKanban();
        }

        function confirmPayment(orderId) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "updateOrderStatus", orderId: orderId, orderStatus: "Paid", paymentStatus: "Paid" })
            });
            localOrders = localOrders.filter(x => String(x.Order_ID).trim() !== String(orderId).trim());
            renderKanban();
            renderTableMatrix();
            Swal.fire({ icon: 'success', title: 'ክፍያው ተረጋግጧል!', timer: 1200, showConfirmButton: false });
        }

        function dismissCall(callId) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "dismissCall", callId: callId })
            });
            const c = localCalls.find(x => String(x.Call_ID).trim() === String(callId).trim());
            if (c) c.Status = "Completed";
            renderCalls();
            renderTableMatrix();
        }

        // 100% Reliable Stock Switcher (Updates Sheet 1)
        function toggleStockStatus(itemId, currentStatus) {
            const newStatus = String(currentStatus).toLowerCase() === "available" ? "Out of Stock" : "Available";
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "updateMenuItemFull", itemId: itemId, status: newStatus })
            });
            const itm = localMenu.find(x => String(x.Item_ID).trim() === String(itemId).trim());
            if (itm) itm.Status = newStatus;
            renderStockList();
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: `ሁኔታው ወደ ${newStatus} ተቀይሯል!`, showConfirmButton: false, timer: 1000 });
        }

        function playAlertSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(type === 'order' ? 587.33 : 880, ctx.currentTime);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.4);
            } catch(e) {}
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        fetchStaffData();
        setInterval(fetchStaffData, 6000);
    </script>
</body>
</html>
